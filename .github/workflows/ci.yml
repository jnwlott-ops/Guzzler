name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci

      # Catches import and native-module wiring that tsc can't see. A bundle
      # failure here means the app would not start on a device.
      - name: Bundle for Android
        run: npx expo export --platform android --output-dir /tmp/guzzler-export
